name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ECommerce.sln

      - name: Build
        run: dotnet build ECommerce.sln --no-restore --configuration Release

      - name: Test
        # Canlı pazaryeri API'lerine giden testler (TestCategory=Live) CI'da çalıştırılmaz.
        run: dotnet test ECommerce.sln --no-build --configuration Release --filter "TestCategory!=Live" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
